name: Build and Deploy Fonts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-libertinus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-fontforge python3-venv woff2

      # python3-fontforge is built for the system Python, so the venv has to be too.
      # pip reads pylock.toml from 26.1 on; --ignore-installed keeps the distro's own
      # Python packages, visible through --system-site-packages, from standing in for them.
      - name: Install Python dependencies
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install 'pip>=26.1'
          .venv/bin/pip install --ignore-installed -r pylock.toml

      - name: Build LibertinusMath
        run: .venv/bin/python LibertinusMath/build.py

      - name: Compress to WOFF2
        working-directory: LibertinusMath
        run: woff2_compress LibertinusMath-Regular.otf

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: LibertinusMath
          path: |
            LibertinusMath/LibertinusMath-Regular.otf
            LibertinusMath/LibertinusMath-Regular.woff2

  build-newcm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-fontforge woff2

      - name: Build NewComputerModernMath
        run: python3 NewComputerModernMath/build.py

      - name: Compress to WOFF2
        working-directory: NewComputerModernMath
        run: woff2_compress NewCMMath-Book.otf

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NewComputerModernMath
          path: |
            NewComputerModernMath/NewCMMath-Book.otf
            NewComputerModernMath/NewCMMath-Book.woff2

  build-noto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-venv woff2

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install 'pip>=26.1'
          .venv/bin/pip install -r pylock.toml

      - name: Build NotoSansMath
        run: .venv/bin/python NotoSansMath/build.py

      - name: Compress to WOFF2
        working-directory: NotoSansMath
        run: woff2_compress NotoSansMath-Regular.otf

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NotoSansMath
          path: |
            NotoSansMath/NotoSansMath-Regular.otf
            NotoSansMath/NotoSansMath-Regular.woff2

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build-libertinus, build-newcm, build-noto]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ github.event.deployment.payload.web_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: site

      - name: Flatten directory structure
        run: |
          mkdir -p fonts
          find site -type f \( -name '*.otf' -o -name '*.woff2' \) -exec cp {} fonts/ \;
          ls -la fonts/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
